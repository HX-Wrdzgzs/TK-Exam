<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafafa">
  <title>团课刷题 · TK Exam</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <div>
        <h1>团课刷题</h1>
        <p id="bank-info">题库加载中…</p>
      </div>
      <div class="header-actions">
        <button type="button" id="export-record">导出记录</button>
        <button type="button" id="import-record">导入记录</button>
        <input type="file" id="import-file" class="hidden" accept=".json,application/json">
      </div>
    </header>

    <nav class="tabs" aria-label="页面导航">
      <button type="button" class="active" data-page="practice">刷题</button>
      <button type="button" data-page="bank">题库</button>
      <button type="button" data-page="wrong">错题本 <span id="wrong-count">0</span></button>
    </nav>

    <main>
      <section id="page-practice" class="page active">
        <div class="toolbar">
          <div class="mode-buttons">
            <button type="button" class="active" id="mode-order" disabled>顺序刷题</button>
            <button type="button" id="mode-random" disabled>随机刷题</button>
            <button type="button" id="mode-wrong" disabled>刷错题</button>
          </div>
          <div class="stats" id="stats">已刷 0 / 594 · 正确率 —</div>
        </div>

        <div id="notice" class="notice" role="status">正在加载题目…</div>

        <section id="quiz" class="quiz hidden" aria-label="当前题目">
          <div class="question-top">
            <div><span id="question-type">单选题</span><span class="subtle" id="question-number">第 1 题</span></div>
            <span class="subtle" id="question-position">1 / 594</span>
          </div>
          <div class="question-text" id="question-text"></div>
          <div id="answer-options" class="options"></div>
          <div id="answer-result" class="answer-result hidden" aria-live="polite"></div>
          <div class="quiz-actions">
            <button type="button" id="previous" disabled>上一题</button>
            <div class="right-actions">
              <button type="button" id="submit" class="primary">确认答案</button>
              <button type="button" id="next">下一题</button>
            </div>
          </div>
        </section>

        <div class="jump">
          <label for="jump-number">跳转到原题号</label>
          <input type="number" min="1" max="594" id="jump-number" placeholder="1-594">
          <button type="button" id="jump-button" disabled>跳转</button>
        </div>
      </section>

      <section id="page-bank" class="page">
        <div class="filter">
          <input type="search" id="search" placeholder="搜索题目或选项" aria-label="搜索题库">
          <select id="type-filter" aria-label="筛选题型">
            <option value="all">全部题型</option>
            <option value="s">单选题</option>
            <option value="m">多选题</option>
            <option value="j">判断题</option>
            <option value="f">填空题</option>
          </select>
        </div>
        <div class="subtle" id="bank-summary"></div>
        <div id="bank-list" class="question-list"></div>
        <div class="pager">
          <button type="button" id="bank-prev">上一页</button>
          <span id="bank-page">1 / 1</span>
          <button type="button" id="bank-next">下一页</button>
        </div>
      </section>

      <section id="page-wrong" class="page">
        <p class="subtle">做错的题会加入错题本；重新答对后移出。</p>
        <div id="wrong-list" class="question-list"></div>
      </section>
    </main>

    <footer>本地保存刷题记录，无需登录。清除浏览器站点数据会丢失记录。</footer>
  </div>
</body>
</html>
